<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>zStockAnalysis (SAPUI5)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SAPUI5 bootstrap from CDN -->
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/resources/sap-ui-core.js"
      data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout,sap.viz,sap.ui.unified"
      data-sap-ui-theme="sap_fiori_3"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-preload="async"
      data-sap-ui-resourceroots='{"zStockAnalysis": "./"}'
      data-sap-ui-oninit="module:sap/ui/core/ComponentSupport">
    </script>

    <!-- SheetJS (xlsx) for client-side Excel parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  </head>
  <body class="sapUiBody">
    <!-- ComponentSupport will instantiate the component declared in manifest.json -->
  </body>
</html>
